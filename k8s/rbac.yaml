apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-demo-app
  namespace: security-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-demo-app
  namespace: security-demo
subjects:
  - kind: ServiceAccount
    name: security-demo-app
    namespace: security-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-demo-app
