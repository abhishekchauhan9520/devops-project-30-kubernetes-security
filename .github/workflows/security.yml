name: Kubernetes Security Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate YAML
        run: python - <<'PY'
import pathlib
import yaml
for p in pathlib.Path('k8s').glob('*.yaml'):
    with p.open() as f:
        list(yaml.safe_load_all(f))
print('YAML validation passed')
PY
      - name: Run security assertions
        run: bash tests/test_security.sh
      - name: Run workload assertions
        run: python tests/validate-workload.py
